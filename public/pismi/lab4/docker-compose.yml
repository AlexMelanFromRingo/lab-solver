# Лабораторна робота № 4. Оточення для Laravel.
#
# Склад узято з архіву Laravel_inst.zip: застосунок, база даних і phpMyAdmin.
# Змінено імена контейнерів та зовнішні порти, щоб робота не конфліктувала з
# попередніми: 8080 зайнятий Apache Tomcat, 8090–8093 – роботами № 1–3.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    ports:
      - "8094:80"
    volumes:
      - ./src:/var/www/html
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public
    depends_on:
      - db
    working_dir: /var/www/html
    command: apache2-foreground

  db:
    image: mysql:8.0
    container_name: mysql_lab4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_lab4
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8095:80"

volumes:
  db_data:
