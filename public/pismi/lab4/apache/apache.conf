# Кореневим каталогом сайту для Laravel є public: усе інше – код застосунку,
# і віддавати його веб-сервером не можна. AllowOverride All потрібен, щоб
# спрацював .htaccess Laravel із правилами mod_rewrite.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
