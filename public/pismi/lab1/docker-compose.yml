# Лабораторна робота № 1. Оточення для розгортання web-додатку.
#
# Склад повторює приклад із методичних вказівок: один контейнер з PHP та
# Apache, каталог www примонтований у корінь веб-сервера. Розширення PHP
# ставляться командою під час запуску контейнера, а не в окремому образі –
# у цій роботі Dockerfile ще не використовується.
#
# Каталог _shared підключений лише для читання: у ньому спільне оформлення
# всіх робіт, і жодна з них не повинна його змінювати.

services:
  web:
    image: php:8.2-apache
    container_name: php_web
    ports:
      # На робочій машині 8080 зайнятий Apache Tomcat, тому назовні
      # відкрито 8090. Усередині контейнера Apache слухає звичайний 80.
      - "8090:80"
    volumes:
      - ./www:/var/www/html
      - ../solver/assets:/var/www/html/_shared:ro
    working_dir: /var/www/html
    restart: unless-stopped
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    command: >
      bash -c "
        apt-get update &&
        apt-get install -y libzip-dev zip unzip git nano &&
        docker-php-ext-install mysqli pdo pdo_mysql zip &&
        a2enmod rewrite &&
        apache2-foreground
      "
